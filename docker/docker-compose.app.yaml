# Conductor App Tier — Backend
# =========================================
# Requires data tier to be running first:
#   docker compose -f docker/docker-compose.data.yaml up -d
#
# Usage:
#   docker compose -f docker/docker-compose.app.yaml up -d
#   make app-up

services:
  backend:
    image: conductor/backend:latest
    container_name: conductor-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@conductor-postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://conductor-redis:6379/0"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config:ro
      - conductor-uploads:/app/uploads
      - conductor-workspaces:/app/workspaces
      # Local Bedrock via SSO profile: mount the host's AWS dir (read-only) so
      # boto3 + the claude CLI resolve `profile: sandbox-render-a` from the
      # cached SSO login. Container runs as root → /root/.aws. Refresh on the
      # HOST with `aws sso login --profile <p>` (~8h); the container reads the
      # refreshed cache through this mount. Harmless if ~/.aws is absent.
      # (Not needed for bearer-token mode — that's self-contained in secrets.)
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - conductor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  conductor:
    external: true
    name: conductor-net

volumes:
  conductor-uploads:
  conductor-workspaces:
