cases:
- id: greptile-sentry-001
  patch: patches/001.patch
  difficulty: hard
  title: Enhanced Pagination Performance for High-Volume Audit Logs
  description: "Test 1\n\nPlanted bugs (per greptile-apps[bot] review):\n  - [src/sentry/api/endpoints/organization_auditlogs.py:11] logic: `OptimizedCursorPaginator` doesn't exist in the codebase - this import will cause an ImportError\n  - [src/sentry/api/endpoints/organization_auditlogs.py:82] logic: `enable_advanced_features` parameter doesn't exist in the paginate method signature"
  source_dir: repos/greptile_bases/sentry/001
  base_sha: a5d290951def84afdcc4c88d2f1f20023fc36e2a
  base_ref: master
  head_ref: performance-enhancement-complete
  expected_findings:
  - title_pattern: negative|offset|slic|Django|queryset|ORM|indexing
    file_pattern: src/sentry/api/paginator\.py
    line_range:
    - 815
    - 910
    severity: critical
    category: correctness
    recommendation: OptimizedCursorPaginator.get_result passes a negative cursor.offset into `queryset[start_offset:stop]`; Django QuerySets do not support negative indexing/slicing and this raises ValueError at runtime. The comment claiming the ORM handles negative slicing is incorrect. Reject/clamp negative offsets or implement real keyset (range) pagination.
- id: greptile-sentry-002
  patch: patches/002.patch
  difficulty: hard
  title: Optimize spans buffer insertion with eviction during insert
  description: "Test 2\n\nPlanted bugs (per greptile-apps[bot] review):\n  - [src/sentry/api/endpoints/organization_auditlogs.py:11] logic: `OptimizedCursorPaginator` is imported but does not exist in the codebase - this will cause ImportError at runtime\n  - [src/sentry/api/endpoints/organization_auditlogs.py:82] logic: `enable_advanced_features` parameter is not supported by the paginator interface - check the `self.paginate` method signature\n  - [src/sentry/spans/consumers/process/factory.py:141] logic: Direct dictionary access to `end_timestamp_precise` will raise KeyError if field is missing. Consider using `.get()` with a default value for backward compatibility."
  source_dir: repos/greptile_bases/sentry/002
  base_sha: 28e3db2520d4ea28c57b08da57b83917ba7b2e15
  base_ref: performance-optimization-baseline
  head_ref: performance-enhancement-complete
  expected_findings:
  - title_pattern: end_timestamp_precise|KeyError|\.get\(
    file_pattern: src/sentry/spans/consumers/process/factory\.py
    line_range:
    - 134
    - 142
    severity: info
    category: correctness
    recommendation: Direct dict access `val["end_timestamp_precise"]` matches the existing required-field idiom and the cast(SpanEvent) annotation; only a concern if the field can legitimately be absent in older producers. Optional `.get()` hedge.
  - title_pattern: negative (offset|index|slic)|Negative indexing|queryset\[start_offset
    file_pattern: src/sentry/api/paginator\.py
    line_range:
    - 868
    - 886
    severity: critical
    category: correctness
    recommendation: OptimizedCursorPaginator.get_result slices the Django queryset with a negative start (`start_offset = cursor.offset` when offset < 0, then `queryset[start_offset:stop]`). Django QuerySet does not support negative indexing and raises AssertionError 'Negative indexing is not supported.' The comment claiming the ORM handles this automatically is incorrect. Clamp offsets to >= 0 or reject negative cursors.
- id: greptile-sentry-003
  patch: patches/003.patch
  difficulty: medium
  title: feat(upsampling) - Support upsampled error count with performance optimizations
  description: "Test 3\n\nPlanted bugs (per greptile-apps[bot] review):\n  - [src/sentry/testutils/factories.py:353] logic: The condition `if client_sample_rate:` will be False for valid sample rate of 0.0. Consider using `if client_sample_rate is not None:` to handle zero sample rates correctly.\n\n```suggestion\n    \n  - [src/sentry/search/events/datasets/discover.py:1051] logic: The `default_result_type` is set to \"number\" but the comment and typical count operations suggest this should be \"integer\". This could cause type inconsistencies in query results.\n  - [src/sentry/api/helpers/error_upsampling.py:95] logic: The transformation assumes `upsampled_count()` function exists in the database schema. This could cause query failures if the function isn't available."
  source_dir: repos/greptile_bases/sentry/003
  base_sha: a5d290951def84afdcc4c88d2f1f20023fc36e2a
  base_ref: master
  head_ref: error-upsampling-race-condition
  expected_findings:
  - title_pattern: client_sample_rate|False|Consider|None
    file_pattern: src/sentry/testutils/factories\.py
    line_range:
    - 348
    - 358
    severity: warning
    category: correctness
    recommendation: The condition `if client_sample_rate:` will be False for valid sample rate of 0.0.
  - title_pattern: default_result_type|This
    file_pattern: src/sentry/search/events/datasets/discover\.py
    line_range:
    - 1046
    - 1056
    severity: warning
    category: correctness
    recommendation: The `default_result_type` is set to "number" but the comment and typical count operations suggest this should be "integer".
  - title_pattern: upsampled_count|This
    file_pattern: src/sentry/api/helpers/error_upsampling\.py
    line_range:
    - 90
    - 100
    severity: warning
    category: correctness
    recommendation: The transformation assumes `upsampled_count()` function exists in the database schema.
- id: greptile-sentry-005
  patch: patches/005.patch
  difficulty: medium
  title: Replays Self-Serve Bulk Delete System
  description: "Test 5\n\nPlanted bugs (per greptile-apps[bot] review):\n  - [src/sentry/workflow_engine/endpoints/validators/base/detector.py:64] logic: Bug: Using 'detector_type' key but field is named 'type'. Should be `validated_data.get('type', instance.group_type).slug`\n\n```suggestion\n        instance.type = validated_data.get(\"type\", inst\n  - [src/sentry/integrations/source_code_management/commit_context.py:601] logic: The method calls `PRCommentWorkflow._truncate_title(title)` but could use the passed `max_length` parameter from the method signature for consistency\n  - [src/sentry/issues/endpoints/browser_reporting_collector.py:60] logic: The mutual exclusion validation between `age` and `timestamp` correctly handles the two W3C specification versions, but both fields are optional which means reports with neither field would pas"
  source_dir: repos/greptile_bases/sentry/005
  base_sha: 49a275847631e231672d01b5dcd66558c069d25b
  base_ref: replays-delete-vulnerable
  head_ref: replays-delete-stable
  expected_findings:
  - title_pattern: Using|detector_type|Should|validated_data
    file_pattern: src/sentry/workflow_engine/endpoints/validators/base/detector\.py
    line_range:
    - 59
    - 69
    severity: warning
    category: correctness
    recommendation: 'Bug: Using ''detector_type'' key but field is named ''type''.'
  - title_pattern: age|timestamp|optional|required|neither|mutual
    file_pattern: src/sentry/issues/endpoints/browser_reporting_collector\.py
    line_range:
    - 55
    - 65
    severity: warning
    category: correctness
    recommendation: BrowserReportSerializer makes both `age` and `timestamp` optional (required=False); the old dataclass structurally required `timestamp`. A report with neither field now passes validation. Consider requiring at least one of age/timestamp.
- id: greptile-sentry-006
  patch: patches/006.patch
  difficulty: medium
  title: Span Buffer Multiprocess Enhancement with Health Monitoring
  description: "Test 6\n\nPlanted bugs (per greptile-apps[bot] review):\n  - [src/sentry/spans/consumers/process/flusher.py:199] syntax: Inconsistent metric tag naming: line 185 uses 'shard' but line 199 uses 'shards' for the same shard_tag value\n\n```suggestion\n                with metrics.timer(\"spans.buffer.flusher.produce\", \n  - [src/sentry/spans/consumers/process/flusher.py:347] logic: Process termination only handles multiprocessing.Process but not threading.Thread cleanup"
  source_dir: repos/greptile_bases/sentry/006
  base_sha: c2c41b0db17dafbcf901412623e874b48ae37a6e
  base_ref: span-flusher-stable
  head_ref: span-flusher-multiprocess
  expected_findings:
  - title_pattern: Inconsistent|shard_tag|flushed_segment|flushed_segments
    file_pattern: src/sentry/spans/consumers/process/flusher\.py
    line_range:
    - 194
    - 204
    severity: warning
    category: correctness
    recommendation: "Inconsistent metric tag naming: line 185 uses 'shard' but line 199 uses 'shards' for the same shard_tag value\n\n```suggestion\n                with metrics.timer(\"spans.buffer.flusher.produce\", tags={\"s"
  - title_pattern: terminate|Thread|join|process
    file_pattern: src/sentry/spans/consumers/process/flusher\.py
    line_range:
    - 336
    - 347
    severity: warning
    category: concurrency
    recommendation: 'join() iterates processes with `if remaining_time <= 0: break` (flusher.py:340-341); on a shutdown timeout this break exits before reaching `process.terminate()` (:346-347) for the remaining multiprocessing.Process workers, leaking them. Restructure so every started process is terminated even after the deadline expires.'
